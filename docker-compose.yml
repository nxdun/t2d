services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
      - WEBUI_PORT=${WEBUI_PORT:-8080}
      - TORRENTING_PORT=${TORRENTING_PORT:-6881}
    ports:
      - "${WEBUI_PORT:-8080}:8080"
      - "${TORRENTING_PORT:-6881}:6881"
      - "${TORRENTING_PORT:-6881}:6881/udp"
    volumes:
      - ./config/qbittorrent:/config
      - ./downloads:/downloads

  ftp:
    image: delfer/alpine-ftp-server:latest
    container_name: ftp-server
    restart: unless-stopped
    environment:
      - USERS=${FTP_USER:-admin}|${FTP_PASS:-admin123}|/ftp/${FTP_USER:-admin}|${PUID:-1000}|${PGID:-1000}
      - ADDRESS=${FTP_PASV_ADDRESS:-127.0.0.1}
      - MIN_PORT=${FTP_PASV_MIN_PORT:-21000}
      - MAX_PORT=${FTP_PASV_MAX_PORT:-21005}
    ports:
      - "${FTP_PORT:-21}:21"
      - "${FTP_PASV_MIN_PORT:-21000}-${FTP_PASV_MAX_PORT:-21005}:${FTP_PASV_MIN_PORT:-21000}-${FTP_PASV_MAX_PORT:-21005}"
    volumes:
      - ./downloads:/ftp/${FTP_USER:-admin}
    depends_on:
      - qbittorrent
